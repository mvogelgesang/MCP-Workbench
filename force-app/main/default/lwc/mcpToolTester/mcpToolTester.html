<template>
    <lightning-card title="MCP Tool Tester" icon-name="utility:agent_astro">
        
        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-is-relative" style="min-height: 200px;">
                <lightning-spinner 
                    alternative-text="Loading" 
                    size="medium">
                </lightning-spinner>
            </div>
        </template>

        <!-- Error Message -->
        <template if:true={hasError}>
            <div class="slds-m-around_medium">
                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                    <span class="slds-assistive-text">Error</span>
                    
                    <div class="slds-grid slds-grid_vertical-align-start slds-gutters_small">                        
                        <!-- Error Content -->
                        <div class="slds-col">
                            <!-- Error Message -->
                            <h2 class="slds-text-heading_small slds-m-bottom_small">
                                <lightning-icon icon-name="utility:error" size="small" variant="inverse" class="slds-m-right_x-small"></lightning-icon><strong>{error}</strong>
                            </h2>
                            
                            <!-- Toggle Details Button -->
                            <template if:true={hasErrorDetails}>
                                <div class="slds-m-bottom_small">
                                    <template if:true={showErrorDetails}>
                                        <lightning-button
                                            label="Hide Details"
                                            variant="base"
                                            icon-name="utility:chevronup"
                                            icon-position="right"
                                            onclick={handleToggleErrorDetails}
                                            class="error-details-toggle">
                                        </lightning-button>
                                    </template>
                                    <template if:false={showErrorDetails}>
                                        <lightning-button
                                            label="Show Details"
                                            variant="base"
                                            icon-name="utility:chevrondown"
                                            icon-position="right"
                                            onclick={handleToggleErrorDetails}
                                            class="error-details-toggle">
                                        </lightning-button>
                                    </template>
                                </div>
                                
                                <!-- Expanded Error Details -->
                                <template if:true={showErrorDetails}>
                                    <div class="error-details slds-m-top_small">
                                        
                                        <!-- Troubleshooting Guide (if available) -->
                                        <template if:true={errorDetails.explanation}>
                                            <div class="slds-m-bottom_medium">
                                               
                                                    <div class="slds-grid slds-grid_vertical-align-start slds-gutters_x-small">
                                                        <div class="slds-col">
                                                            <p class="slds-text-heading_small slds-m-bottom_x-small">
                                                                <span class="slds-m-right_x-small">💡</span> <strong>Troubleshooting Guide:</strong>
                                                            </p>
                                                            <p >
                                                                {errorDetails.explanation}
                                                            </p>
                                                        </div>
                                                    </div>
                                            
                                            </div>
                                        </template>
                                        
                                        <!-- Technical Details -->
                                        <div>
                                            <div class="slds-text-heading_small slds-m-bottom_x-small">
                                                <strong>Technical Details:</strong>
                                            </div>
                                            <div class="error-json-container">
                                                <pre class="error-details-text">{errorDetailsJson}</pre>
                                            </div>
                                        </div>
                                        
                                    </div>
                                </template>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- Server Selection View -->
        <template if:true={isServerSelectView}>
            <div class="slds-m-around_medium">
                <div class="slds-text-align_center slds-p-around_large">
                    <lightning-icon icon-name="utility:agent_astro" size="large" class="slds-m-bottom_medium"></lightning-icon>
                    <h2 class="slds-text-heading_medium slds-m-bottom_small">MCP Tool Tester</h2>
                    <p class="slds-text-body_regular slds-m-bottom_medium slds-text-color_weak">
                        Select an MCP server to discover and test available tools
                    </p>
                </div>

                <!-- Server Selection -->
                <div class="slds-box slds-m-horizontal_xx-large">
                    <h3 class="slds-text-heading_small slds-m-bottom_medium">Select MCP Server</h3>
                    
                    <template if:true={hasServerOptions}>
                        <lightning-combobox
                            name="server"
                            label="Named Credential"
                            value={selectedServer}
                            placeholder="Select an MCP server..."
                            options={serverOptions}
                            onchange={handleServerChange}
                            class="slds-m-bottom_small">
                        </lightning-combobox>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                            Or enter the Named Credential API name manually below
                        </p>
                    </template>

                    <template if:true={hasServerListError}>
                        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                            <span class="slds-assistive-text">Warning</span>
                            <p class="slds-text-body_small">
                                <lightning-icon icon-name="utility:warning" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                                {serverListError}
                            </p>
                        </div>
                    </template>

                    <lightning-input
                        label="Named Credential API Name"
                        placeholder="e.g., PetStore, news, notion2"
                        value={selectedServer}
                        onchange={handleManualServerInput}
                        class="slds-m-bottom_medium">
                    </lightning-input>

                    <lightning-button 
                        label="Connect to Server" 
                        variant="brand"
                        onclick={handleConnect}
                        disabled={isLoading}
                        class="slds-m-top_small">
                    </lightning-button>
                </div>
            </div>
        </template>

        <!-- Tools List View -->
        <template if:true={isToolsView}>
            <div class="slds-m-around_medium">
                <div class="slds-page-header slds-m-bottom_medium">
                    <div class="slds-page-header__row">
                        <div class="slds-page-header__col-title">
                            <lightning-button 
                                icon-name="utility:back"
                                variant="base"
                                onclick={handleBackToServers}
                                class="slds-m-right_small">
                            </lightning-button>
                            <div class="slds-media">
                                <div class="slds-media__body">
                                    <h1 class="slds-page-header__title">Available Tools</h1>
                                    <p class="slds-text-body_small">Server: {selectedServerLabel}</p>
                                </div>
                            </div>
                        </div>
                        <div class="slds-page-header__col-actions">
                            <lightning-button 
                                label="Refresh Tools" 
                                icon-name="utility:refresh"
                                onclick={loadTools}
                                disabled={isLoading}>
                            </lightning-button>
                        </div>
                    </div>
                </div>

                <!-- Server Connection Details (collapsible) -->
                <template if:true={isInitialized}>
                    <div class="slds-m-bottom_medium">
                        <button class="slds-button slds-section__title-action slds-p-around_small" onclick={handleToggleServerInfo}>
                            <lightning-icon 
                                icon-name={serverInfoToggleIcon}
                                size="xx-small" 
                                class="slds-m-right_x-small">
                            </lightning-icon>
                            <lightning-icon icon-name="utility:success" size="xx-small" variant="success" class="slds-m-right_x-small"></lightning-icon>
                            <span class="slds-text-body_regular"><strong>Server Connection Details</strong> — {selectedServerLabel}</span>
                        </button>
                        <template if:true={showServerInfo}>
                            <div class="slds-box slds-theme_shade server-info-section">
                                <pre class="schema-text">{serverInfoDisplay}</pre>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Permissions Diagnostic (collapsible) -->
                <template if:true={isInitialized}>
                    <div class="slds-m-bottom_medium">
                        <button class="slds-button slds-section__title-action slds-p-around_small" onclick={handleTogglePermissionsDiagnostic}>
                            <lightning-icon
                                icon-name={permissionsDiagnosticToggleIcon}
                                size="xx-small"
                                class="slds-m-right_x-small">
                            </lightning-icon>
                            <lightning-icon icon-name="utility:user" size="xx-small" class="slds-m-right_x-small"></lightning-icon>
                            <span class="slds-text-body_regular"><strong>User Permissions Diagnostic</strong> — checks against common user permissioning issues</span>
                        </button>
                        <template if:true={showPermissionsDiagnostic}>
                            <div class="slds-box server-info-section permissions-panel">

                                <template if:true={permissionsDiagnosticLoading}>
                                    <div class="slds-is-relative slds-p-vertical_medium" style="min-height: 60px;">
                                        <lightning-spinner alternative-text="Running diagnostic" size="small"></lightning-spinner>
                                    </div>
                                </template>

                                <template if:true={hasPermissionsDiagnosticError}>
                                    <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                                        <span class="slds-assistive-text">Warning</span>
                                        <p class="slds-text-body_small">
                                            <lightning-icon icon-name="utility:warning" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                                            {permissionsDiagnosticError}
                                        </p>
                                    </div>
                                </template>

                                <template if:true={hasPermissionsDiagnostic}>
                                    <!-- Summary -->
                                    <div class="slds-m-bottom_small">
                                        <template if:true={permissionsDiagnostic.hasWarning}>
                                            <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_small" role="alert">
                                                <span class="slds-assistive-text">Warning</span>
                                                <p class="slds-text-body_small">
                                                    <lightning-icon icon-name="utility:warning" size="x-small" variant="inverse" class="slds-m-right_x-small"></lightning-icon>
                                                    {permissionsDiagnostic.warning}
                                                </p>
                                            </div>
                                        </template>
                                        <p class="slds-text-body_small">
                                            <strong>Named Credential:</strong> {permissionsDiagnostic.namedCredential}
                                        </p>
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            <b>Double check</b> Permission Sets granting access to the <code>ExternalCredentialParameter</code> and ensure they grant permission to the principal associated with your external credential. This column is a strong indicator, not a guarantee.
                                        </p>
                                    </div>

                                    <!-- Per-user diagnostic table -->
                                    <template if:true={permissionsDiagnostic.userResults.length}>
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-bottom_medium">
                                            <thead>
                                                <tr class="slds-line-height_reset">
                                                    <th scope="col"><div class="slds-truncate" title="User">User</div></th>
                                                    <th scope="col"><div class="slds-truncate" title="Role">Role</div></th>
                                                    <th scope="col"><div class="slds-truncate" title="External Credential access">External Credential Access</div></th>
                                                    <th scope="col"><div class="slds-truncate" title="UserExternalCredential Read">User External Credential sObject Read</div></th>
                                                    <th scope="col"><div class="slds-truncate" title="Notes">Notes</div></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={permissionsDiagnostic.userResults} for:item="user">
                                                    <tr key={user.key} class="slds-hint-parent">
                                                        <td data-label="User">
                                                            <div class="slds-text-body_small">
                                                                <strong>{user.name}</strong>
                                                                <template if:false={user.isActive}>
                                                                    <span class="slds-badge slds-badge_inverse slds-m-left_x-small">{user.activeLabel}</span>
                                                                </template>
                                                            </div>
                                                            <div class="slds-text-body_small slds-text-color_weak">{user.username}</div>
                                                        </td>
                                                        <td data-label="Role">
                                                            <div class="slds-text-body_small">{user.roleLabel}</div>
                                                        </td>
                                                        <td data-label="EC access (heuristic)" class="slds-cell-wrap">
                                                            <lightning-icon icon-name={user.externalCredentialIcon} variant={user.externalCredentialIconVariant} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                                            <span class="slds-text-body_small">{user.externalCredentialStatus}</span>
                                                            <template if:true={user.hasExternalCredentialGrants}>
                                                                <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                                    via {user.externalCredentialGrantsDisplay}
                                                                </div>
                                                            </template>
                                                        </td>
                                                        <td data-label="UEC Read" class="slds-cell-wrap">
                                                            <lightning-icon icon-name={user.uecIcon} variant={user.uecIconVariant} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                                            <span class="slds-text-body_small">{user.uecStatus}</span>
                                                            <template if:true={user.hasUecGrants}>
                                                                <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                                                    via {user.uecGrantsDisplay}
                                                                </div>
                                                            </template>
                                                        </td>
                                                        <td data-label="Notes" class="slds-cell-wrap">
                                                            <div class="slds-text-body_small">{user.fixHint}</div>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </template>
                                    
                                </template>

                                <!-- Optional Username + Refresh -->
                                <div class="slds-grid slds-grid_vertical-align-end slds-gutters_small slds-m-top_medium">
                                    <div class="slds-col slds-grow">
                                        <lightning-input
                                            label="Also check a specific Username"
                                            placeholder="user@example.com"
                                            value={additionalUsername}
                                            onchange={handleAdditionalUsernameChange}>
                                        </lightning-input>
                                    </div>
                                    <div class="slds-col slds-no-flex">
                                        <lightning-button
                                            label="Run"
                                            icon-name="utility:refresh"
                                            variant="neutral"
                                            onclick={handleRunPermissionsDiagnostic}
                                            disabled={permissionsDiagnosticLoading}>
                                        </lightning-button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:true={hasTools}>
                    <div class="slds-grid slds-wrap slds-gutters">
                        <template for:each={tools} for:item="tool">
                            <div key={tool.key} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
                                <article class="slds-card tool-card" data-tool={tool.name} onclick={handleToolSelect}>
                                    <div class="slds-card__header">
                                        <header class="slds-media slds-media_center">
                                            <div class="slds-media__figure">
                                                <lightning-icon icon-name="standard:code_set" size="small"></lightning-icon>
                                            </div>
                                            <div class="slds-media__body">
                                                <h2 class="slds-card__header-title">
                                                    <span class="slds-text-heading_small">{tool.title}</span>
                                                </h2>
                                            </div>
                                        </header>
                                    </div>
                                    <div class="slds-card__body slds-card__body_inner">
                                        <div class={tool.descriptionContainerClass}>
                                            <div class="tool-card__doc-body">
                                                <template if:true={tool.descriptionIsMarkdown}>
                                                    <div class="tool-description tool-description_markdown slds-text-body_small">
                                                        <lightning-formatted-rich-text value={tool.descriptionHtml}></lightning-formatted-rich-text>
                                                    </div>
                                                </template>
                                                <template if:false={tool.descriptionIsMarkdown}>
                                                    <p class="tool-description slds-text-body_small">{tool.description}</p>
                                                </template>
                                            </div>
                                            <template if:true={tool.descriptionToggleNeeded}>
                                                <button
                                                    type="button"
                                                    class="tool-card__doc-toggle"
                                                    data-tool={tool.name}
                                                    onclick={handleToggleToolDescription}>
                                                    {tool.descriptionToggleLabel}
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                    <footer class="slds-card__footer">
                                        <span class="slds-text-body_small slds-text-color_weak">Click to test</span>
                                    </footer>
                                </article>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={hasTools}>
                    <div class="slds-box slds-text-align_center">
                        <p>No tools available</p>
                    </div>
                </template>
            </div>
        </template>

        <!-- Tool Testing View -->
        <template if:true={isTestingView}>
            <div class="slds-m-around_medium test-page">
                <!-- Compact title row: title + id + server + status pill + back -->
                <div class="test-page__title-row">
                    <lightning-button-icon
                        icon-name="utility:back"
                        variant="bare"
                        alternative-text="Back to tools"
                        onclick={handleBackToTools}
                        class="test-page__back">
                    </lightning-button-icon>
                    <h1 class="test-page__title">{selectedTool.title}</h1>
                    <span class="test-page__id" title="Tool identifier">{selectedTool.name}</span>
                    <span class="test-page__server" title="Named Credential">{selectedServerLabel}</span>
                    <template if:true={hasResponse}>
                        <span class={responseMetadata.statusPillClass}>
                            {responseMetadata.statusLabel} · {responseMetadata.durationLabel}
                        </span>
                    </template>
                </div>

                <!-- Description (collapsible) -->
                <template if:true={hasDescription}>
                    <div class={descriptionContainerClass}>
                        <div class="tool-doc__body">
                            <template if:true={selectedTool.descriptionIsMarkdown}>
                                <div class="tool-description tool-description_markdown slds-text-body_small">
                                    <lightning-formatted-rich-text value={selectedTool.descriptionHtml}></lightning-formatted-rich-text>
                                </div>
                            </template>
                            <template if:false={selectedTool.descriptionIsMarkdown}>
                                <p class="tool-description slds-text-body_small">{selectedTool.description}</p>
                            </template>
                        </div>
                        <template if:true={descriptionToggleNeeded}>
                            <button class="tool-doc__toggle" onclick={handleToggleDescription} type="button">
                                {descriptionToggleLabel}
                            </button>
                        </template>
                    </div>
                </template>

                <!-- Top tab strip: Test | Schema -->
                <div class="test-tab-strip" role="tablist">
                    <button
                        type="button"
                        role="tab"
                        aria-selected={isTestTab}
                        class={testTabBtnClass}
                        onclick={handleSwitchToTestTab}>
                        Test
                    </button>
                    <button
                        type="button"
                        role="tab"
                        aria-selected={isSchemaTab}
                        class={schemaTabBtnClass}
                        onclick={handleSwitchToSchemaTab}>
                        Schema
                    </button>
                </div>

                <!-- Test tab -->
                <template if:true={isTestTab}>
                    <div class={testSurfaceClass}>
                        <!-- Inputs card with sticky bottom action bar -->
                        <section class={inputsCardClass} aria-label="Inputs">
                            <header class="inputs-card__header">
                                <h3 class="slds-text-heading_small">Inputs</h3>
                            </header>

                            <div class="inputs-card__scroll" data-id="inputs-scroll">
                                <template if:true={toolInputFields.length}>
                                    <template for:each={toolInputFields} for:item="field">
                                        <div key={field.key} class="slds-m-bottom_medium">
                                            <!-- Regular (non-array) input -->
                                            <template if:false={field.isArray}>
                                                <lightning-input
                                                    name={field.name}
                                                    label={field.label}
                                                    type={field.type}
                                                    data-param={field.name}
                                                    onchange={handleParameterChange}
                                                    required={field.required}>
                                                </lightning-input>
                                                <template if:true={field.description}>
                                                    <div class="slds-form-element__help">{field.description}</div>
                                                </template>
                                            </template>

                                            <!-- Array input -->
                                            <template if:true={field.isArray}>
                                                <div class="slds-form-element">
                                                    <label class="slds-form-element__label">
                                                        {field.label}
                                                        <template if:true={field.required}>
                                                            <abbr class="slds-required" title="required">*</abbr>
                                                        </template>
                                                    </label>
                                                    <template if:true={field.description}>
                                                        <div class="slds-form-element__help slds-m-bottom_x-small">{field.description}</div>
                                                    </template>

                                                    <div class="slds-box slds-box_x-small slds-theme_shade">
                                                        <template if:true={field.items.length}>
                                                            <template for:each={field.items} for:item="item">
                                                                <div key={item.key} class="slds-grid slds-grid_vertical-align-center slds-gutters_x-small slds-m-bottom_x-small">
                                                                    <div class="slds-col slds-grow">
                                                                        <lightning-input
                                                                            value={item.value}
                                                                            type={field.itemType}
                                                                            data-param={field.name}
                                                                            data-index={item.index}
                                                                            onchange={handleArrayItemChange}
                                                                            variant="label-hidden">
                                                                        </lightning-input>
                                                                    </div>
                                                                    <div class="slds-col slds-no-flex">
                                                                        <lightning-button-icon
                                                                            icon-name="utility:delete"
                                                                            variant="bare"
                                                                            alternative-text="Remove item"
                                                                            data-param={field.name}
                                                                            data-index={item.index}
                                                                            onclick={handleRemoveArrayItem}>
                                                                        </lightning-button-icon>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </template>

                                                        <template if:false={field.items.length}>
                                                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_x-small">
                                                                No items added yet
                                                            </p>
                                                        </template>

                                                        <lightning-button
                                                            label="Add Item"
                                                            icon-name="utility:add"
                                                            variant="neutral"
                                                            data-param={field.name}
                                                            onclick={handleAddArrayItem}
                                                            class="slds-m-top_x-small">
                                                        </lightning-button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </template>

                                <template if:false={toolInputFields.length}>
                                    <p class="slds-text-body_small slds-text-color_weak">No input parameters required</p>
                                </template>
                            </div>

                            <!-- Overflow hint: only shown when the inputs scroll
                                 region overflows its container so the user
                                 knows there are fields above the sticky action
                                 bar that they need to scroll up to see. -->
                            <template if:true={inputsHasOverflow}>
                                <div class="inputs-card__scroll-hint" aria-hidden="true">
                                    <lightning-icon icon-name="utility:up" size="xx-small"></lightning-icon>
                                    <span>More fields above &mdash; scroll to review before executing</span>
                                </div>
                            </template>

                            <footer class="inputs-card__action-bar">
                                <lightning-button
                                    label="Reset"
                                    variant="neutral"
                                    onclick={handleResetInputs}
                                    disabled={isLoading}
                                    class="slds-m-right_small">
                                </lightning-button>
                                <lightning-button
                                    label="Execute Tool"
                                    variant="brand"
                                    onclick={handleExecuteTool}
                                    disabled={isLoading}>
                                </lightning-button>
                            </footer>
                        </section>

                        <!-- Response card (post-execute) or placeholder (pre-execute) -->
                        <template if:true={hasResponse}>
                            <section class="response-card" aria-label="Response">
                                <header class="response-card__header">
                                    <h3 class="slds-text-heading_small">Response</h3>
                                    <span class={responseMetadata.statusPillClass}>
                                        {responseMetadata.statusLabel}
                                    </span>
                                    <span class="response-card__duration">{responseMetadata.durationLabel}</span>
                                    <template if:true={responseCopiedMsg}>
                                        <span class="response-card__copied">{responseCopiedMsg}</span>
                                    </template>
                                    <lightning-button-icon
                                        icon-name="utility:copy"
                                        variant="bare"
                                        size="small"
                                        alternative-text="Copy response"
                                        title="Copy active tab"
                                        onclick={handleCopyResponse}
                                        class="response-card__copy">
                                    </lightning-button-icon>
                                </header>
                                <div class="response-card__sub-tabs" role="tablist">
                                    <button
                                        type="button"
                                        role="tab"
                                        aria-selected={isResponsePrettyTab}
                                        class={prettyTabBtnClass}
                                        onclick={handleResponseTabPretty}>
                                        Pretty
                                    </button>
                                    <button
                                        type="button"
                                        role="tab"
                                        aria-selected={isResponseRawTab}
                                        class={rawTabBtnClass}
                                        onclick={handleResponseTabRaw}>
                                        Raw
                                    </button>
                                    <button
                                        type="button"
                                        role="tab"
                                        aria-selected={isResponseHeadersTab}
                                        class={headersTabBtnClass}
                                        onclick={handleResponseTabHeaders}>
                                        Headers
                                    </button>
                                </div>
                                <div class="response-card__body">
                                    <template if:true={isResponsePrettyTab}>
                                        <pre class="response-text">{toolResponse}</pre>
                                    </template>
                                    <template if:true={isResponseRawTab}>
                                        <pre class="response-text">{responseMetadata.rawBody}</pre>
                                    </template>
                                    <template if:true={isResponseHeadersTab}>
                                        <template if:true={hasResponseHeaders}>
                                            <table class="response-headers">
                                                <tbody>
                                                    <template for:each={responseMetadata.headerEntries} for:item="hdr">
                                                        <tr key={hdr.key}>
                                                            <th scope="row">{hdr.name}</th>
                                                            <td>{hdr.value}</td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </template>
                                        <template if:false={hasResponseHeaders}>
                                            <p class="slds-text-color_weak slds-text-body_small">
                                                No response headers were captured for this call.
                                            </p>
                                        </template>
                                    </template>
                                </div>
                            </section>
                        </template>

                        <template if:false={hasResponse}>
                            <div class="response-placeholder" aria-hidden="true">
                                <lightning-icon
                                    icon-name="utility:forward"
                                    size="medium"
                                    class="response-placeholder__icon">
                                </lightning-icon>
                                <p class="response-placeholder__title">Response will appear here</p>
                                <p class="response-placeholder__subtitle">
                                    Fill in the inputs and click Execute Tool. Your response, headers, and raw payload all land in this panel.
                                </p>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Schema tab -->
                <template if:true={isSchemaTab}>
                    <section class="schema-card" aria-label="Schema">
                        <header class="schema-card__header">
                            <h3 class="slds-text-heading_small">Input Schema</h3>
                            <template if:true={schemaCopiedMsg}>
                                <span class="schema-card__copied">{schemaCopiedMsg}</span>
                            </template>
                            <lightning-button-icon
                                icon-name="utility:copy"
                                variant="bare"
                                size="small"
                                alternative-text="Copy schema"
                                title="Copy schema"
                                onclick={handleCopySchema}>
                            </lightning-button-icon>
                        </header>
                        <pre class="schema-text schema-card__body">{selectedToolSchema}</pre>
                    </section>
                </template>
            </div>
        </template>

        <!-- Network trace docked panel (rendered on all views) -->
        <c-mcp-network-trace
            entries={traceEntries}
            expanded={showNetworkTrace}
            ontoggle={handleToggleNetworkTrace}
            onclear={handleClearNetworkTrace}>
        </c-mcp-network-trace>

    </lightning-card>
</template>
